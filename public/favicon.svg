<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Основное свечение для Циана -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Свечение для Мадженты -->
    <filter id="magentaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Градиент фона -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#0a1a2f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#02060c;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Фон иконки -->
  <rect width="32" height="32" rx="7" fill="url(#bgGrad)" />
  
  <!-- Декоративная рамка (тонкая) -->
  <rect x="2" y="2" width="28" height="28" rx="5" fill="none" stroke="#00f0ff" stroke-width="0.3" stroke-opacity="0.3" />

  <!-- Стилизованная буква 'K' -->
  <g transform="translate(1, 0)">
    <!-- Вертикальная линия -->
    <path d="M10 8 L10 24" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" filter="url(#cyanGlow)" />
    
    <!-- Верхнее крыло (Маджента/Акцент) -->
    <path d="M10 16 L20 8" stroke="#ff003c" stroke-width="2.5" stroke-linecap="round" filter="url(#magentaGlow)" />
    
    <!-- Нижнее крыло (Циан) -->
    <path d="M10 16 L22 24" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" filter="url(#cyanGlow)" />
  </g>
  
  <!-- Точка 'портала' -->
  <circle cx="24" cy="12" r="1.5" fill="#ffee00" filter="url(#cyanGlow)" />
</svg>
