openapi: 3.0.3
info:
  title: AI Analytics Interface API
  description: |
    REST API для управления промптами, историей ответов и взаимодействия с AI моделями.
    
    Поддерживает провайдеров:
    - **GROQ API** - высокоскоростной inference (в 5-10 раз быстрее)
    - **OpenRouter API** - большое разнообразие моделей (20+ моделей)
    - **Direct API** - прямое подключение к API (например, z.ai)
    - **GigaChat API** - Сбер GigaChat
    
    Система автоматически определяет провайдера по имени модели или позволяет принудительный выбор.
    Поддерживает RAG (Retrieval-Augmented Generation) для обоих провайдеров.
  version: 1.0.0
  contact:
    name: AIAN-MODEL Project
  license:
    name: MIT
servers:
  - url: http://localhost:3002
    description: Локальный сервер разработки
  - url: http://localhost:3000
    description: Альтернативный порт

tags:
  - name: OpenAI Compatible
    description: OpenAI-совместимый API для интеграции с LangChain, OpenAI SDK и т.д.
  - name: AI Models
    description: Операции с AI моделями и отправка запросов
  - name: Prompts
    description: Управление промптами
  - name: Responses
    description: Управление историей ответов
  - name: RAG
    description: Retrieval-Augmented Generation
  - name: Files
    description: Работа с файлами
  - name: Configuration
    description: Конфигурация и информация о сервере

paths:
  /v1/chat/completions:
    post:
      tags:
        - OpenAI Compatible
      summary: Chat Completions (OpenAI-совместимый)
      description: |
        Полностью совместимый с OpenAI API эндпоинт для чат-комплитов.
        Поддерживает стандартный формат запроса/ответа OpenAI.
        
        **Streaming:**
        При `stream: true` возвращает Server-Sent Events (SSE) в формате OpenAI:
        ```
        data: {"id":"chatcmpl-xxx","object":"chat.completion.chunk","choices":[{"delta":{"role":"assistant"}}]}
        data: {"id":"chatcmpl-xxx","object":"chat.completion.chunk","choices":[{"delta":{"content":"Hello"}}]}
        data: {"id":"chatcmpl-xxx","object":"chat.completion.chunk","choices":[{"delta":{},"finish_reason":"stop"}]}
        data: [DONE]
        ```
        
        Поддержка streaming по провайдерам:
        - **GROQ** — полная поддержка (нативный streaming)
        - **OpenRouter** — полная поддержка (SSE)
        - **Direct/GigaChat** — эмуляция (ответ разбивается на чанки)
        
        **Аутентификация:**
        - Если `OPENAI_COMPAT_API_KEY` задан в .env — требуется Bearer Token
        - Если не задан — доступ без аутентификации
        
        **Пример использования с OpenAI Python SDK:**
        ```python
        from openai import OpenAI
        
        client = OpenAI(
            base_url="http://localhost:3002/v1",
            api_key="your-key"
        )
        
        # Обычный режим
        response = client.chat.completions.create(
            model="llama-3.3-70b-versatile",
            messages=[{"role": "user", "content": "Hello!"}]
        )
        
        # Streaming режим
        stream = client.chat.completions.create(
            model="FAST",
            messages=[{"role": "user", "content": "Hello!"}],
            stream=True
        )
        for chunk in stream:
            if chunk.choices[0].delta.content:
                print(chunk.choices[0].delta.content, end="")
        ```
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAIChatCompletionRequest'
            examples:
              simple:
                summary: Простой запрос
                value:
                  model: "llama-3.3-70b-versatile"
                  messages:
                    - role: "system"
                      content: "You are a helpful assistant."
                    - role: "user"
                      content: "Hello!"
              with_history:
                summary: С историей диалога
                value:
                  model: "FAST"
                  messages:
                    - role: "system"
                      content: "Ты полезный помощник"
                    - role: "user"
                      content: "Привет!"
                    - role: "assistant"
                      content: "Привет! Чем могу помочь?"
                    - role: "user"
                      content: "Расскажи о погоде"
                  temperature: 0.8
                  max_tokens: 500
              streaming:
                summary: Streaming режим
                value:
                  model: "llama-3.3-70b-versatile"
                  messages:
                    - role: "user"
                      content: "Напиши короткий рассказ"
                  stream: true
      responses:
        '200':
          description: |
            Успешный ответ.
            - При `stream: false` — JSON с полным ответом
            - При `stream: true` — Server-Sent Events (text/event-stream)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIChatCompletionResponse'
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE поток с чанками в формате:
                  ```
                  data: {"id":"...","object":"chat.completion.chunk","choices":[{"delta":{"content":"..."}}]}
                  
                  data: [DONE]
                  ```
              example: |
                data: {"id":"chatcmpl-xxx","object":"chat.completion.chunk","created":1700000000,"model":"llama-3.3-70b-versatile","choices":[{"index":0,"delta":{"role":"assistant"},"finish_reason":null}]}
                
                data: {"id":"chatcmpl-xxx","object":"chat.completion.chunk","created":1700000000,"model":"llama-3.3-70b-versatile","choices":[{"index":0,"delta":{"content":"Hello"},"finish_reason":null}]}
                
                data: {"id":"chatcmpl-xxx","object":"chat.completion.chunk","created":1700000000,"model":"llama-3.3-70b-versatile","choices":[{"index":0,"delta":{},"finish_reason":"stop"}]}
                
                data: [DONE]
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '401':
          description: Ошибка аутентификации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'

  /v1/models:
    get:
      tags:
        - OpenAI Compatible
      summary: Список моделей (OpenAI-совместимый)
      description: |
        Возвращает список доступных моделей в формате OpenAI API.
        Включает только активные модели (enabled: true).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Список моделей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIModelList'
        '401':
          description: Ошибка аутентификации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '500':
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'

  /api/send-request:
    post:
      tags:
        - AI Models
      summary: Отправка запроса к AI модели
      description: |
        Отправляет запрос к модели AI и возвращает ответ.
        Поддерживает автоматический выбор провайдера или принудительное указание.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendRequestBody'
            examples:
              groq_auto:
                summary: Автоматический выбор GROQ
                value:
                  model: "llama-3.3-70b-versatile"
                  prompt: "Ты полезный помощник AI. Отвечай кратко и по делу."
                  inputText: "Объясни что такое машинное обучение"
              openrouter_force:
                summary: Принудительный OpenRouter
                value:
                  model: "deepseek/deepseek-chat:free"
                  prompt: "Ты помощник по анализу данных"
                  inputText: "Как очистить данные от выбросов?"
                  provider: "openroute"
              with_rag:
                summary: С использованием RAG
                value:
                  model: "llama-3.3-70b-versatile"
                  prompt: "Отвечай на основе предоставленного контекста"
                  inputText: "Как настроить GROQ API?"
                  useRag: true
                  contextCode: "documentation"
                  saveResponse: true
              preset_fast:
                summary: Использование предустановленного типа FAST
                value:
                  model: "FAST"
                  prompt: "Ты аналитик данных, отвечай мгновенно и кратко"
                  inputText: "Сформируй сводку по продажам за квартал"
                  saveResponse: true
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIResponse'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDetailed'

  /api/send-request-sys:
    post:
      tags:
        - AI Models
      summary: Отправка запроса с использованием сохраненного промпта
      description: |
        Отправляет запрос к модели AI, используя промпт по имени из хранилища промптов.
        Автоматически сохраняет ответ в историю (если не отключено).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendRequestSysBody'
            example:
              model: "llama-3.3-70b-versatile"
              prompt_name: "Анализ кода"
              inputText: "function add(a, b) { return a + b; }"
              provider: "groq"
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIResponseWithPrompt'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Промпт не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /analyze:
    post:
      tags:
        - AI Models
      summary: Альтернативный маршрут для анализа
      description: Альтернативный маршрут для отправки запросов к AI моделям с поддержкой RAG
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeRequestBody'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIResponse'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/check-api-key:
    get:
      tags:
        - Configuration
      summary: Проверка доступности API-ключа
      description: Проверяет доступность и валидность настроенного API-ключа
      responses:
        '200':
          description: Информация о доступности API-ключа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyStatus'

  /api/config:
    get:
      tags:
        - Configuration
      summary: Получение конфигурации сервера
      description: Возвращает текущую конфигурацию сервера
      responses:
        '200':
          description: Конфигурация сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerConfig'

  /api/available-models:
    get:
      tags:
        - AI Models
      summary: Получение списка доступных моделей
      description: |
        Возвращает массив строк с именами всех доступных моделей, 
        которые отмечены как showInApi: true
      responses:
        '200':
          description: Список названий моделей
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example:
                  - "llama-3.3-70b-versatile"
                  - "llama3-8b-8192"
                  - "mixtral-8x7b-32768"
                  - "google/gemini-2.0-flash-exp:free"
                  - "deepseek/deepseek-chat:free"

  /api/all-models:
    get:
      tags:
        - AI Models
      summary: Получение полной информации о моделях
      description: |
        Возвращает массив объектов с полной информацией о всех доступных моделях,
        включая провайдера, настройки и метаданные
      responses:
        '200':
          description: Полная информация о моделях
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelInfo'

  /api/models/update/{id}:
    post:
      tags:
        - AI Models
      summary: Обновление параметров модели
      description: Позволяет включить/отключить модель или изменить другие параметры
      parameters:
        - name: id
          in: path
          required: true
          description: ID модели
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelUpdateBody'
      responses:
        '200':
          description: Модель успешно обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '404':
          description: Модель не найдена

  /api/models/add:
    post:
      tags:
        - AI Models
      summary: Добавление новой модели
      description: Добавляет новую конфигурацию модели в систему
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelAddBody'
      responses:
        '201':
          description: Модель успешно создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelInfo'

  /api/test-model:
    post:
      tags:
        - AI Models
      summary: Тестирование модели
      description: |
        Отправляет тестовый запрос к модели и возвращает результат.
        Тестовый промпт: "Кто ты? Ответь в одном предложении на русском."
        Результат сохраняется в поле last_test модели.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestModelBody'
      responses:
        '200':
          description: Результат тестирования
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestModelResult'
        '400':
          description: modelId не указан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Модель не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/about-model:
    post:
      tags:
        - AI Models
      summary: Получение информации о модели от самой модели
      description: |
        Отправляет запрос модели с просьбой описать себя.
        Промпт: "Привет! Что ты за модель? В чем твоя особенность? В чем твоё преимущество перед другими моделями?"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AboutModelBody'
      responses:
        '200':
          description: Самоописание модели
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AboutModelResult'
        '400':
          description: modelId не указан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Модель не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/user-types:
    get:
      tags:
        - AI Models
      summary: Получение списка пользовательских типов моделей
      description: Возвращает уникальные значения user_type из всех моделей с информацией о связанных моделях
      responses:
        '200':
          description: Список пользовательских типов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTypesResponse'
        '500':
          description: Ошибка загрузки типов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/prompts:
    get:
      tags:
        - Prompts
      summary: Получение списка всех промптов
      description: Возвращает список всех сохраненных промптов
      responses:
        '200':
          description: Список промптов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Prompt'
    post:
      tags:
        - Prompts
      summary: Добавление нового промпта
      description: Создает новый промпт в хранилище
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptCreateBody'
      responses:
        '200':
          description: Промпт успешно добавлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/prompts/{name}:
    put:
      tags:
        - Prompts
      summary: Обновление существующего промпта
      description: Обновляет содержимое промпта по имени
      parameters:
        - name: name
          in: path
          required: true
          description: Имя промпта для обновления
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptUpdateBody'
      responses:
        '200':
          description: Промпт успешно обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '404':
          description: Промпт не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Prompts
      summary: Удаление промпта
      description: Удаляет промпт из хранилища по имени
      parameters:
        - name: name
          in: path
          required: true
          description: Имя промпта для удаления
          schema:
            type: string
      responses:
        '200':
          description: Промпт успешно удален
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '404':
          description: Промпт не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/available-prompts:
    get:
      tags:
        - Prompts
      summary: Получение списка доступных промптов
      description: Возвращает список всех доступных промптов (алиас для /api/prompts)
      responses:
        '200':
          description: Список доступных промптов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Prompt'

  /api/responses:
    get:
      tags:
        - Responses
      summary: Получение истории ответов
      description: |
        Возвращает историю сохраненных ответов с возможностью фильтрации и сортировки
      parameters:
        - name: sortBy
          in: query
          description: Поле для сортировки
          schema:
            type: string
        - name: sortOrder
          in: query
          description: Порядок сортировки
          schema:
            type: string
            enum: [asc, desc]
        - name: model
          in: query
          description: Фильтр по модели
          schema:
            type: string
        - name: prompt
          in: query
          description: Фильтр по имени промпта
          schema:
            type: string
        - name: dateFrom
          in: query
          description: Фильтр по начальной дате
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          description: Фильтр по конечной дате
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          description: Ограничение количества результатов
          schema:
            type: integer
      responses:
        '200':
          description: История ответов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResponseRecord'
    post:
      tags:
        - Responses
      summary: Сохранение нового ответа
      description: Сохраняет новый ответ в историю
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponseCreateBody'
      responses:
        '200':
          description: Ответ успешно сохранен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseCreateResult'

  /api/responses/{id}:
    delete:
      tags:
        - Responses
      summary: Удаление записи из истории
      description: Удаляет запись из истории ответов по ID
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор записи для удаления
          schema:
            type: string
      responses:
        '200':
          description: Запись успешно удалена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '404':
          description: Запись не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/rag/context-codes:
    get:
      tags:
        - RAG
      summary: Получение списка контекстных кодов
      description: Возвращает список доступных контекстных кодов для RAG
      responses:
        '200':
          description: Список контекстных кодов
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: ["code1", "code2", "code3"]

  /api/rag/documents:
    get:
      tags:
        - RAG
      summary: Получение списка документов
      description: Возвращает список документов в базе знаний RAG
      responses:
        '200':
          description: Список документов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RagDocument'

  /api/rag/ask:
    post:
      tags:
        - RAG
      summary: Запрос к RAG с использованием контекстного кода
      description: Выполняет запрос к базе знаний RAG
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RagAskBody'
      responses:
        '200':
          description: Ответ от RAG системы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagResponse'

  /api/rag/debug-info:
    get:
      tags:
        - RAG
      summary: Получение отладочной информации RAG
      description: Возвращает отладочную информацию о состоянии RAG системы
      responses:
        '200':
          description: Отладочная информация RAG
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagDebugInfo'

  /api/markdown_files:
    get:
      tags:
        - Files
      summary: Получение списка markdown файлов
      description: Возвращает список .md файлов в корневой директории проекта
      responses:
        '200':
          description: Список markdown файлов
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example:
                  - "README.md"
                  - "README_REST.md"
                  - "README_ADD_NEW_PROVIDER.md"

  /get_md_content:
    get:
      tags:
        - Files
      summary: Получение содержимого markdown файла
      description: Возвращает содержимое указанного .md файла
      parameters:
        - name: file
          in: query
          required: true
          description: Имя markdown файла
          schema:
            type: string
          example: "README.md"
      responses:
        '200':
          description: Содержимое файла
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Файл не указан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Файл не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/save-markdown:
    post:
      tags:
        - Files
      summary: Сохранение файла markdown
      description: Сохраняет содержимое в markdown файл
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveMarkdownBody'
      responses:
        '200':
          description: Файл успешно сохранен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveMarkdownResult'

  /api/output-dir-info:
    get:
      tags:
        - Files
      summary: Получение информации о директории документов
      description: Возвращает информацию о директории вывода документов
      responses:
        '200':
          description: Информация о директории
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutputDirInfo'

  /server-info:
    get:
      tags:
        - Configuration
      summary: Получение информации о сервере
      description: Возвращает базовую информацию о сервере
      responses:
        '200':
          description: Информация о сервере
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'

components:
  schemas:
    SendRequestBody:
      type: object
      required:
        - model
        - prompt
        - inputText
      properties:
        model:
          type: string
          description: |
            Идентификатор модели AI для использования.
            Вместо полного имени можно указать ключевые слова `CHEAP`, `FAST` или `RICH`
            для использования предустановленных моделей по умолчанию.
            Если поле не указано или пустое, используется профиль `CHEAP`.
          example: "llama-3.3-70b-versatile"
        prompt:
          type: string
          description: Системный промпт для модели
          example: "Ты полезный помощник AI. Отвечай кратко и по делу."
        inputText:
          type: string
          description: Запрос пользователя
          example: "Объясни что такое машинное обучение"
        provider:
          type: string
          enum: [groq, openroute, direct, gigachat]
          description: |
            Принудительный выбор провайдера:
            - groq: GROQ API (быстрый inference)
            - openroute: OpenRouter API (больше моделей)
            - direct: Прямое подключение к API (например, z.ai)
            - gigachat: Сбер GigaChat API
            - Не указан: автоматическое определение по модели
          example: "groq"
        saveResponse:
          type: boolean
          default: false
          description: Сохранять ли ответ в историю
        useRag:
          type: boolean
          default: false
          description: Использовать ли RAG для обогащения контекста
        contextCode:
          type: string
          description: Код контекста для RAG (если useRag=true)
          example: "documentation"

    SendRequestSysBody:
      type: object
      required:
        - model
        - prompt_name
        - inputText
      properties:
        model:
          type: string
          description: |
            Идентификатор модели AI для использования. Поддерживаются ключевые слова
            `CHEAP`, `FAST`, `RICH`, а также пустое значение (эквивалентно `CHEAP`).
          example: "llama-3.3-70b-versatile"
        prompt_name:
          type: string
          description: Имя системного промпта из хранилища
          example: "Анализ кода"
        inputText:
          type: string
          description: Запрос пользователя
          example: "function add(a, b) { return a + b; }"
        provider:
          type: string
          enum: [groq, openroute, direct, gigachat]
          description: Принудительный выбор провайдера
        saveResponse:
          type: boolean
          default: true
          description: Сохранять ли ответ в историю

    AnalyzeRequestBody:
      type: object
      required:
        - model
        - prompt
        - inputText
      properties:
        model:
          type: string
          description: |
            Идентификатор модели AI.
            Можно использовать ключевые слова `CHEAP`, `FAST`, `RICH` или оставить поле пустым
            для выбора соответствующей предустановленной модели.
        prompt:
          type: string
          description: Системный промпт
        inputText:
          type: string
          description: Входной текст
        provider:
          type: string
          enum: [groq, openroute, direct, gigachat]
          description: Принудительный выбор провайдера
        useRag:
          type: boolean
          default: false
          description: Использовать RAG
        contextCode:
          type: string
          description: Код контекста для RAG

    AIResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        content:
          type: string
          description: Ответ от AI модели
          example: "Машинное обучение - это подобласть искусственного интеллекта..."
        model:
          type: string
          description: Использованная модель
          example: "llama-3.3-70b-versatile"
        provider:
          type: string
          description: Использованный провайдер
          example: "groq"
        usage:
          $ref: '#/components/schemas/TokenUsage'
        rag:
          $ref: '#/components/schemas/RagInfo'

    AIResponseWithPrompt:
      allOf:
        - $ref: '#/components/schemas/AIResponse'
        - type: object
          properties:
            prompt_used:
              $ref: '#/components/schemas/PromptUsed'

    TokenUsage:
      type: object
      properties:
        prompt_tokens:
          type: integer
          example: 42
        completion_tokens:
          type: integer
          example: 128
        total_tokens:
          type: integer
          example: 170

    RagInfo:
      type: object
      nullable: true
      properties:
        used:
          type: boolean
          description: Был ли использован RAG
        contextCode:
          type: string
          description: Код контекста
        documentsCount:
          type: integer
          description: Количество найденных документов
        sources:
          type: array
          items:
            $ref: '#/components/schemas/RagSource'

    RagSource:
      type: object
      properties:
        filename:
          type: string
        source:
          type: string
        contextCode:
          type: string

    PromptUsed:
      type: object
      properties:
        name:
          type: string
          description: Имя использованного промпта
        text:
          type: string
          description: Текст промпта

    ModelInfo:
      type: object
      properties:
        id:
          type: string
          description: Уникальный ID модели
        name:
          type: string
          description: Внутреннее имя модели для API
          example: "llama-3.3-70b-versatile"
        visible_name:
          type: string
          description: Отображаемое имя в UI
          example: "🚀 GROQ: Llama 3.3 70B (Versatile)"
        provider:
          type: string
          enum: [groq, openroute, direct, gigachat]
          description: Провайдер API
        context:
          type: integer
          description: Размер контекстного окна
          example: 8192
        fast:
          type: boolean
          description: Флаг быстрой модели
        showInApi:
          type: boolean
          description: Доступность через API
        enabled:
          type: boolean
          description: Активна ли модель
        is_default:
          type: boolean
          description: Выбрана ли как дефолтная для своей роли

    ModelUpdateBody:
      type: object
      properties:
        enabled:
          type: boolean
          description: Статус активности модели

    ModelAddBody:
      type: object
      required:
        - id
        - name
        - provider
      properties:
        id:
          type: string
        name:
          type: string
        provider:
          type: string
        visible_name:
          type: string
        context:
          type: integer
        base_url:
          type: string
        api_key:
          type: string

    TestModelBody:
      type: object
      required:
        - modelId
      properties:
        modelId:
          type: string
          description: ID модели для тестирования
          example: "groq-llama-3.3-70b-versatile"

    TestModelResult:
      type: object
      properties:
        success:
          type: boolean
          example: true
        result:
          type: object
          properties:
            success:
              type: boolean
              description: Успешность теста
            response_time_ms:
              type: integer
              description: Время ответа в миллисекундах
              example: 1234
            sample_response:
              type: string
              nullable: true
              description: Ответ модели на тестовый запрос
              example: "Я - большая языковая модель Llama 3.3..."
            error_message:
              type: string
              description: Сообщение об ошибке (если тест не прошёл)
            timestamp:
              type: string
              format: date-time

    AboutModelBody:
      type: object
      required:
        - modelId
      properties:
        modelId:
          type: string
          description: ID модели
          example: "groq-llama-3.3-70b-versatile"

    AboutModelResult:
      type: object
      properties:
        success:
          type: boolean
          example: true
        about:
          type: string
          description: Самоописание модели
          example: "Привет! Я Llama 3.3 70B — мощная языковая модель..."

    UserTypesResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        count:
          type: integer
          description: Количество уникальных типов
          example: 3
        types:
          type: array
          items:
            type: string
          description: Список уникальных user_type
          example: ["CHEAP", "FAST", "RICH"]
        details:
          type: array
          items:
            type: object
            properties:
              user_type:
                type: string
              model_id:
                type: string
              model_name:
                type: string
              visible_name:
                type: string
              provider:
                type: string
              enabled:
                type: boolean

    ApiKeyStatus:
      type: object
      properties:
        isAvailable:
          type: boolean
          example: true
        serviceProvider:
          type: string
          example: "OpenRouter"

    ServerConfig:
      type: object
      properties:
        server:
          type: object
          properties:
            port:
              type: string
              example: "3000"
            nodeEnv:
              type: string
              example: "development"
            isTestMode:
              type: boolean
              example: false
        n8n:
          type: object
          properties:
            webhookUrl:
              type: string
              example: "https://example.com/webhook"
        apiKey:
          type: string
          description: Замаскированный API ключ
        logging:
          type: object
          properties:
            level:
              type: string
              example: "info"
            filename:
              type: string
              example: "combined.log"
            errorFilename:
              type: string
              example: "error.log"

    Prompt:
      type: object
      properties:
        name:
          type: string
          description: Имя промпта
          example: "Анализ текста"
        text:
          type: string
          description: Содержимое промпта
          example: "Проанализируй следующий текст: {{text}}"

    PromptCreateBody:
      type: object
      required:
        - name
        - text
      properties:
        name:
          type: string
          description: Имя нового промпта
        text:
          type: string
          description: Содержимое промпта

    PromptUpdateBody:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          description: Новое содержимое промпта

    ResponseRecord:
      type: object
      properties:
        id:
          type: string
          description: Уникальный идентификатор записи
          example: "1615293487123"
        timestamp:
          type: string
          format: date-time
          description: Время создания записи
          example: "2023-03-09T12:31:27.123Z"
        model:
          type: string
          description: Использованная модель
          example: "gpt-3.5-turbo"
        promptName:
          type: string
          description: Имя промпта
          example: "Анализ текста"
        prompt:
          type: string
          description: Текст промпта
          example: "Проанализируй следующий текст: {{text}}"
        inputText:
          type: string
          description: Входной текст пользователя
          example: "Пример текста для анализа"
        response:
          type: string
          description: Ответ модели
          example: "Ответ модели на запрос"

    ResponseCreateBody:
      type: object
      required:
        - model
        - promptName
        - prompt
        - inputText
        - response
      properties:
        model:
          type: string
          description: Использованная модель
        promptName:
          type: string
          description: Имя промпта
        prompt:
          type: string
          description: Текст промпта
        inputText:
          type: string
          description: Входной текст
        response:
          type: string
          description: Ответ модели

    ResponseCreateResult:
      type: object
      properties:
        message:
          type: string
          example: "Response saved successfully"
        id:
          type: string
          description: ID созданной записи
          example: "1615293487123"

    RagDocument:
      type: object
      properties:
        id:
          type: string
          example: "1"
        filename:
          type: string
          example: "document1.txt"
        contextCode:
          type: string
          example: "code1"
        source:
          type: string
          example: "source1"

    RagAskBody:
      type: object
      required:
        - question
      properties:
        question:
          type: string
          description: Вопрос для запроса к базе знаний
          example: "Вопрос пользователя"
        contextCode:
          type: string
          description: Фильтр по коду контекста
          example: "code1"
        showDetails:
          type: boolean
          default: false
          description: Показывать детальную информацию

    RagResponse:
      type: object
      properties:
        answer:
          type: string
          description: Ответ, основанный на документах
        documents:
          type: array
          items:
            type: object
            properties:
              pageContent:
                type: string
                description: Содержимое документа
              metadata:
                type: object
                properties:
                  filename:
                    type: string
                  source:
                    type: string
                  contextCode:
                    type: string
        contextCode:
          type: string

    RagDebugInfo:
      type: object
      properties:
        ragEnabled:
          type: boolean
          example: true
        finalInputText:
          type: string
          description: Финальный входной текст с контекстом
        ragInfo:
          $ref: '#/components/schemas/RagInfo'
        timestamp:
          type: string
          format: date-time

    SaveMarkdownBody:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          description: Содержимое markdown файла
          example: "# Markdown содержимое\n\nТекст документа"
        filename:
          type: string
          description: Имя файла (если не указано, генерируется автоматически)
          example: "document.md"
        directory:
          type: string
          description: Директория для сохранения
          example: "path/to/directory"

    SaveMarkdownResult:
      type: object
      properties:
        success:
          type: boolean
          example: true
        filePath:
          type: string
          description: Путь к сохраненному файлу
          example: "path/to/directory/document.md"
        message:
          type: string
          example: "Файл успешно сохранен: path/to/directory/document.md"

    OutputDirInfo:
      type: object
      properties:
        outputDir:
          type: string
          description: Путь к директории вывода
          example: "output_docs"
        exists:
          type: boolean
          description: Существует ли директория
          example: true
        files:
          type: array
          description: Список файлов в директории
          items:
            type: object
            properties:
              name:
                type: string
                description: Имя файла
                example: "document1.md"
              path:
                type: string
                description: Полный путь к файлу
                example: "output_docs/document1.md"
              size:
                type: integer
                description: Размер файла в байтах
                example: 1024

    ServerInfo:
      type: object
      properties:
        hostname:
          type: string
          example: "server-name"
        platform:
          type: string
          example: "win32"
        arch:
          type: string
          example: "x64"
        nodeVersion:
          type: string
          example: "v18.16.0"
        uptime:
          type: integer
          description: Время работы сервера в секундах
          example: 3600
        baseUrl:
          type: string
          example: "http://localhost:3002"
        port:
          type: string
          example: "3002"
        appName:
          type: string
          example: "AI Analytics Interface"
        timestamp:
          type: string
          format: date-time

    SuccessMessage:
      type: object
      properties:
        message:
          type: string
          description: Сообщение об успешном выполнении операции

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Описание ошибки
          example: "Описание ошибки"

    ErrorResponseDetailed:
      type: object
      properties:
        error:
          type: string
          description: Описание ошибки
        data:
          type: object
          description: Полные данные ответа от API при некорректной структуре
        details:
          type: object
          description: Дополнительная информация об ошибке

    # OpenAI-совместимые схемы
    OpenAIChatCompletionRequest:
      type: object
      required:
        - model
        - messages
      properties:
        model:
          type: string
          description: |
            ID модели или алиас (CHEAP, FAST, RICH).
            Примеры: llama-3.3-70b-versatile, deepseek/deepseek-chat:free, FAST
          example: "llama-3.3-70b-versatile"
        messages:
          type: array
          description: Массив сообщений диалога
          items:
            $ref: '#/components/schemas/OpenAIChatMessage'
          minItems: 1
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 0.7
          description: Температура генерации (0-2)
        max_tokens:
          type: integer
          minimum: 1
          default: 1024
          description: Максимальное количество токенов в ответе
        stream:
          type: boolean
          default: false
          description: |
            Потоковый режим (SSE). При `true` ответ приходит в формате Server-Sent Events.
            Поддерживается для провайдеров: GROQ (нативно), OpenRouter (нативно).
            Для Direct/GigaChat стриминг эмулируется.

    OpenAIChatMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [system, user, assistant]
          description: Роль отправителя сообщения
        content:
          type: string
          description: Содержимое сообщения

    OpenAIChatCompletionResponse:
      type: object
      properties:
        id:
          type: string
          description: Уникальный идентификатор ответа
          example: "chatcmpl-abc123xyz"
        object:
          type: string
          enum: [chat.completion]
          example: "chat.completion"
        created:
          type: integer
          description: Unix timestamp создания ответа
          example: 1700000000
        model:
          type: string
          description: Использованная модель
          example: "llama-3.3-70b-versatile"
        choices:
          type: array
          items:
            $ref: '#/components/schemas/OpenAIChatChoice'
        usage:
          $ref: '#/components/schemas/OpenAIUsage'

    OpenAIChatCompletionChunk:
      type: object
      description: Чанк ответа при streaming (SSE формат)
      properties:
        id:
          type: string
          description: Уникальный идентификатор стрима (одинаковый для всех чанков)
          example: "chatcmpl-abc123xyz"
        object:
          type: string
          enum: [chat.completion.chunk]
          example: "chat.completion.chunk"
        created:
          type: integer
          description: Unix timestamp
          example: 1700000000
        model:
          type: string
          description: Модель
          example: "llama-3.3-70b-versatile"
        choices:
          type: array
          items:
            $ref: '#/components/schemas/OpenAIStreamChoice'

    OpenAIStreamChoice:
      type: object
      properties:
        index:
          type: integer
          example: 0
        delta:
          type: object
          description: Дельта (изменение) сообщения
          properties:
            role:
              type: string
              description: Роль (только в первом чанке)
              example: "assistant"
            content:
              type: string
              description: Часть контента
              example: "Hello"
        finish_reason:
          type: string
          nullable: true
          enum: [stop, length, null]
          description: Причина завершения (только в последнем чанке)

    OpenAIChatChoice:
      type: object
      properties:
        index:
          type: integer
          example: 0
        message:
          $ref: '#/components/schemas/OpenAIChatMessage'
        finish_reason:
          type: string
          enum: [stop, length, content_filter]
          example: "stop"

    OpenAIUsage:
      type: object
      properties:
        prompt_tokens:
          type: integer
          example: 42
        completion_tokens:
          type: integer
          example: 128
        total_tokens:
          type: integer
          example: 170

    OpenAIModelList:
      type: object
      properties:
        object:
          type: string
          enum: [list]
          example: "list"
        data:
          type: array
          items:
            $ref: '#/components/schemas/OpenAIModel'

    OpenAIModel:
      type: object
      properties:
        id:
          type: string
          description: ID модели
          example: "llama-3.3-70b-versatile"
        object:
          type: string
          enum: [model]
          example: "model"
        created:
          type: integer
          description: Unix timestamp добавления модели
          example: 1700000000
        owned_by:
          type: string
          description: Провайдер модели
          example: "groq"

    OpenAIError:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
              description: Описание ошибки
              example: "Invalid API key provided"
            type:
              type: string
              description: Тип ошибки
              example: "invalid_request_error"
            param:
              type: string
              nullable: true
              description: Параметр, вызвавший ошибку
            code:
              type: string
              description: Код ошибки
              example: "invalid_api_key"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        Bearer Token аутентификация для OpenAI-совместимого API.
        Токен должен совпадать со значением OPENAI_COMPAT_API_KEY в .env.
        Если OPENAI_COMPAT_API_KEY не задан — аутентификация не требуется.

  parameters:
    PromptName:
      name: name
      in: path
      required: true
      description: Имя промпта
      schema:
        type: string

    ResponseId:
      name: id
      in: path
      required: true
      description: Идентификатор записи ответа
      schema:
        type: string

  examples:
    GroqRequest:
      summary: Запрос к GROQ модели
      value:
        model: "llama-3.3-70b-versatile"
        prompt: "Ты полезный помощник AI. Отвечай кратко и по делу."
        inputText: "Объясни что такое машинное обучение"
        provider: "groq"

    OpenRouterRequest:
      summary: Запрос к OpenRouter модели
      value:
        model: "deepseek/deepseek-chat:free"
        prompt: "Ты помощник по анализу данных"
        inputText: "Как очистить данные от выбросов?"
        provider: "openroute"

    RagRequest:
      summary: Запрос с использованием RAG
      value:
        model: "llama-3.3-70b-versatile"
        prompt: "Отвечай на основе предоставленного контекста"
        inputText: "Как настроить GROQ API?"
        useRag: true
        contextCode: "documentation"
        saveResponse: true

security: []
